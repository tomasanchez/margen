# Margen Web CI (Vite React frontend, apps/web).
# Workflow-level path filter: GitHub Actions `paths:` is per-workflow, not per-job,
# so this file only runs when apps/web or this workflow itself changes.

name: Web

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'apps/web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  # Install, lint, type-check + build, unit tests.
  build:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      # Provision pnpm honoring the `packageManager` field in apps/web/package.json
      # (pnpm 10.12.4). Must run before setup-node so the pnpm cache can be wired up.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Report high/critical dependency advisories WITHOUT blocking the build.
      # Fresh transitive-dev-dep CVEs (vite/postcss/jsdom/eslint chains) were
      # firing ~weekly and blocking unrelated feature PRs one at a time; the
      # advisories are still surfaced here (step annotation + log) so we can pin
      # them via pnpm.overrides, but they no longer gate merges. Re-enable gating
      # by removing continue-on-error if this app's risk posture changes.
      - name: Audit dependencies (high+)
        continue-on-error: true
        run: pnpm audit --audit-level high
      - name: Lint
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm test
